<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Appellation Atlas</title>
<meta name="description" content="Every wine place in the world on one globe, with what is planted there, its climate, its rock and its land.">
<link rel="icon" href="assets/appellation-atlas-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/appellation-atlas.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/appellation-atlas-180.png">
<meta name="apple-mobile-web-app-title" content="Wine Atlas">
<meta name="apple-itunes-app" content="app-id=6839710428">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="atlas.css">
</head>
<body class="app home">
<!-- the map fills the screen; the panels float over it (RootView in the app) -->
<div id="map" class="map"></div>
<div class="topbar">
  <a class="pill title-pill" href="./" title="Back to the world">Appellation Atlas</a>
  <button type="button" class="pill round" data-units aria-label="Units"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</div>
<div class="key" aria-hidden="true"><span class="kr"><i class="a4"></i>Essential benchmark</span><span class="kr"><i class="a3"></i>Benchmark</span><span class="kr"><i class="a2"></i>Inside a benchmark</span><span class="kr"><i class="a2 o"></i>Other</span></div>
<div class="side">
  <div class="title-row"><h1 class="app-title"><a href="./" title="Back to the world">Appellation Atlas</a></h1>
    <button type="button" class="gear" data-units aria-label="Units"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button></div>
  <div class="search" role="combobox" aria-haspopup="listbox" aria-owns="sugg">
    <label><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span class="sr">Search</span><input id="q" type="search" placeholder="Search a country, region or appellation" autocomplete="off" autocapitalize="off" spellcheck="false" aria-autocomplete="list" aria-controls="sugg" aria-expanded="false"></label>
    <ul id="sugg" class="sugg" role="listbox" hidden></ul>
  </div>
  <div class="filter" role="group" aria-label="Show on the map"><button type="button" data-filter="all" aria-pressed="true">All places</button><button type="button" data-filter="bench" aria-pressed="false">Benchmarks</button><button type="button" data-filter="essential" aria-pressed="false">Essential</button></div>
  <div id="sidePairs" class="side-pairs"></div>
  <p class="side-foot"><button type="button" class="lk" data-about>About</button> · <a class="lk" href="https://apps.apple.com/app/id6839710428" target="_blank" rel="noopener">Get the iPhone and iPad app</a></p>
</div>
<main>
  <div class="grab" aria-hidden="true"></div>
  <section class="origin">
    <p id="crumbs" class="crumbs"></p>
    <div id="ptitle" class="hero"></div>
    <p id="mapNote" class="mapnote" hidden></p>
    <p id="shapeNote" class="shape-note" hidden></p>
  </section>
  <div id="info"></div>
</main>
<script src="atlas.js"></script>
</body>
</html>
