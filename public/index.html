<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Appellation Atlas</title>
<meta name="description" content="Every wine place in the world on one globe, with what is planted there, its climate, its rock and its land.">
<link rel="icon" href="assets/appellation-atlas-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/appellation-atlas.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/appellation-atlas-180.png">
<meta name="apple-mobile-web-app-title" content="Wine Atlas">
<meta name="apple-itunes-app" content="app-id=6839710428">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="atlas.css">
</head>
<body class="app">
<div class="page">
  <div class="side">
  <div class="title-row"><h1 class="app-title ts-page_title"><a href="./" title="Back to the world">Appellation Atlas</a></h1>
    <button type="button" class="gear" data-units aria-label="Units"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button></div>
  <header class="top">
    <div class="search" role="combobox" aria-haspopup="listbox" aria-owns="sugg">
      <label><span class="sr">Search</span><input id="q" type="search" class="ts-body" placeholder="Search a country, region or appellation" autocomplete="off" autocapitalize="off" spellcheck="false" aria-autocomplete="list" aria-controls="sugg" aria-expanded="false"></label>
      <ul id="sugg" class="sugg" role="listbox" hidden></ul>
    </div>
  </header>
  <div class="filter" role="group" aria-label="Show on the map"><button type="button" class="ts-body" data-filter="all" aria-pressed="true">All places</button><button type="button" class="ts-body" data-filter="bench" aria-pressed="false">Benchmarks</button><button type="button" class="ts-body" data-filter="essential" aria-pressed="false">Essential</button></div>
  <div id="sidePairs" class="side-pairs"></div>
  </div>
  <main>
    <section class="row origin">
      <p id="crumbs" class="crumbs ts-place_subtitle"></p>
      <div id="ptitle" class="hero"></div>
      <p id="mapNote" class="ts-caption mapnote"></p>
      <div id="map" class="map"></div>
      <p id="shapeNote" class="ts-caption shape-note" hidden></p>
      <div class="key" aria-hidden="true"><div class="kr ts-caption"><i class="a4"></i>Essential benchmark</div><div class="kr ts-caption"><i class="a3"></i>Benchmark</div><div class="kr ts-caption"><i class="a2"></i>Inside a benchmark</div><div class="kr ts-caption"><i class="a2 o"></i>Other</div></div>
      <div id="places" class="places"></div>
    </section>
    <div id="info"></div>
  </main>
</div>
<script src="atlas.js"></script>
</body>
</html>
